
[project]
name = "api"
version = "0.1.0"
description = "Clause - AI Powered Shop Assistant using RAG"
readme = "README.md"
authors = [
    { name = "Abdul Ahad", email = "adii.here.0165@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.6",
    "langchain-ollama>=1.1.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "pypdf>=6.0.0",
    "fastapi[standard]>=0.162.2",
    "langchain-google-genai>=4.4.3",
    "fastembed>=0.9.1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
